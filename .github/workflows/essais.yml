# Epreuves — a chaque poussee et a chaque proposition de fusion.
#
# Le but n'est pas de decorer le depot d'une pastille verte : c'est d'empecher
# qu'une correction de securite soit annulee sans que personne ne s'en apercoive.
# Les fichiers `tests/audit_*.rs` sont d'anciens exploits devenus epreuves de
# non-regression ; s'ils tombent, une faille est revenue.

name: Epreuves

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Le code monetaire ne tolere aucun debordement silencieux, y compris pendant
  # les epreuves.
  RUSTFLAGS: "-D warnings"

jobs:
  epreuves:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # La version vient de `rust-toolchain.toml` : la meme que la livraison.
      # Installee par `rustup` directement, et non par une action tierce
      # suivie sur une branche mouvante : le programme qui compile le
      # portefeuille ne doit dependre de rien que quelqu'un puisse reecrire
      # entre deux executions.
      - name: Chaine Rust
        shell: bash
        run: |
          set -eu
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.95.0
          rustc --version

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # Les sources de `ml-dsa` sont dans `vendor/`, et `.cargo/config.toml` y
      # redirige crates.io. La compilation ne depend donc d'aucun reseau, et
      # deux compilations a deux mois d'intervalle emploient exactement le meme
      # code de signature.
      - name: Verifier que les sources vendorisees sont la
        shell: bash
        run: |
          test -d vendor/ml-dsa || { echo "vendor/ml-dsa absent"; exit 1; }
          test -f .cargo/config.toml || { echo ".cargo/config.toml absent"; exit 1; }

      - name: Compilation
        run: cargo build --locked --features mldsa

      # Toutes les epreuves, sans enumeration.
      #
      # Cette etape enumerait les fichiers un par un. Le piege est mecanique :
      # un fichier d'epreuves ajoute au depot et oublie dans cette liste
      # n'est jamais execute en integration, et une epreuve qui ne tourne pas
      # est une decoration. Cinq fichiers etaient dans ce cas —
      # `regression_chainage`, les trois `*audit2*` / `*audit_v2*`, et
      # `regression_reproductible`. Sans argument `--test`, cargo passe tout
      # ce qui existe, aujourd'hui et demain.
      - name: Epreuves
        run: cargo test --locked --features mldsa,audit

      - name: Clippy
        run: cargo clippy --locked --all-targets --features mldsa,audit

      - name: Format
        run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'

  # ---------------------------------------------------------------------------
  # Les dependances
  # ---------------------------------------------------------------------------
  #
  # Une seule dependance directe, vendorisee — mais une faille publiee sur
  # l'une de ses dependances transitives doit se voir le jour meme, pas au
  # prochain audit. `cargo deny` confronte `Cargo.lock` a la base RustSec, et
  # applique la politique de `deny.toml` : licences, doublons, sources.
  dependances:
    name: Dependances (RustSec, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features

  # ---------------------------------------------------------------------------
  #
  # `vendor/` s'auto-certifie : cargo verifie que chaque fichier a la somme
  # inscrite dans `.cargo-checksum.json`, et que le champ `package` de ce
  # fichier egale `Cargo.lock` — il ne recalcule jamais `package` a partir des
  # fichiers. Une crate modifiee dont on regenere la carte des sommes passe
  # `--locked` sans un mot. Ce travail refait donc `cargo vendor` depuis
  # crates.io dans un dossier propre et exige que le resultat soit identique,
  # octet pour octet, a ce que le depot embarque. Toute divergence — une ligne
  # ajoutee, un fichier de plus — arrete la fusion.
  vendor:
    name: Vendor identique a crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chaine d'outils
        shell: bash
        run: |
          set -eu
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Revendoriser et comparer
        shell: bash
        run: |
          set -eu
          # Sans le remplacement de source : on veut crates.io, pas vendor/.
          mv .cargo/config.toml /tmp/config.toml.depot
          cargo vendor --locked /tmp/vendor-neuf > /dev/null
          mv /tmp/config.toml.depot .cargo/config.toml

          # On compare les SOURCES, pas la comptabilite interne de cargo.
          #
          # `.cargo-checksum.json` est un fichier que cargo ecrit pour son
          # propre usage ; son format a change entre la version de cargo qui a
          # cree `vendor/` et une autre, si bien que deux vendorisations d'un
          # meme crate, aux sources rigoureusement identiques, produisent des
          # `.cargo-checksum.json` differents. Les exclure supprime ce faux
          # positif sans rien relacher : la propriete qu'on veut est « les
          # sources vendorisees sont celles de crates.io », et une source
          # falsifiee ne correspondrait pas a la vendorisation fraiche, quel
          # que soit le contenu de son fichier de sommes.
          if ! diff -r --brief --exclude=.cargo-checksum.json vendor /tmp/vendor-neuf; then
            echo "::error::une source vendorisee differe de ce que crates.io fournit pour Cargo.lock : source modifiee, ou lock qui ne correspond plus."
            exit 1
          fi
          echo "vendor/ : sources identiques a crates.io, fichier pour fichier."

      # Et l'inverse : chaque fichier vendorise correspond-il a la somme que
      # son propre `.cargo-checksum.json` annonce ? C'est ce que cargo verifie
      # a la compilation ; on le refait ici a decouvert, pour qu'une source
      # modifiee dont on aurait aussi reecrit la carte des sommes — donc
      # coherente avec elle-meme — soit tout de meme prise par l'etape
      # precedente, qui la compare a crates.io.
      - name: Chaque source vendorisee correspond a sa somme enregistree
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import json, glob, hashlib, os, sys
          mauvais = 0
          total = 0
          for carte in glob.glob("vendor/*/.cargo-checksum.json"):
              d = os.path.dirname(carte)
              sommes = json.load(open(carte))["files"]
              for rel, attendue in sommes.items():
                  total += 1
                  chemin = os.path.join(d, rel)
                  try:
                      obtenue = hashlib.sha256(open(chemin, "rb").read()).hexdigest()
                  except FileNotFoundError:
                      print(f"::error::{chemin} : annonce dans les sommes, absent du vendor")
                      mauvais += 1
                      continue
                  if obtenue != attendue:
                      print(f"::error::{chemin} : contenu different de la somme enregistree")
                      mauvais += 1
          print(f"{total} fichiers vendorises verifies, {mauvais} incoherent(s).")
          sys.exit(1 if mauvais else 0)
          PY

  # Compilation reproductible : deux repertoires, un condensat.
  #
  # # Ce que ce travail garde
  #
  # Le condensat SHA-256 publie avec un binaire ne prouve que le transport :
  # il est produit sur la meme machine que le fichier, publie au meme endroit,
  # et remplace avec lui par quiconque prend la main sur le depot. La seule
  # preuve qu'un binaire vient bien de sources publiques est qu'une tierce
  # personne puisse le **recompiler a l'identique** et retrouver le meme
  # condensat. Pour cela, la compilation ne doit dependre d'aucune variable
  # locale — et la premiere de ces variables est le repertoire de travail,
  # que rustc inscrit dans le binaire pour les messages de panique.
  #
  # Ce travail compile le meme commit dans deux repertoires de longueur et de
  # profondeur differentes, sans cache partage, et exige l'egalite des deux
  # condensats. S'ils divergent, la reproductibilite est cassee et la fusion
  # s'arrete — avant qu'une livraison non verifiable ne soit publiee.
  #
  # C'est la propriete que Bitcoin Core obtient par Guix, et la condition de
  # tout le reste : sans elle, le depot d'attestations n'a rien a attester.
  # Voir REPRODUIRE.md.
  reproductible:
    name: Compilation reproductible
    runs-on: ubuntu-latest
    # Le `-D warnings` global n'a pas sa place ici, et il empeche meme ce
    # travail. `verifier-reproductible.sh` pose ses propres drapeaux — le
    # remappage de chemin qui rend le binaire independant du repertoire — et
    # refuse de tourner si RUSTFLAGS est deja defini, car il l'ecraserait sans
    # le dire. Le vider pour ce travail leve le conflit ; la reproductibilite
    # se moque des avertissements, elle ne regarde que les octets du binaire.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Chaine d'outils
        shell: bash
        run: |
          set -eu
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
          rustc --version
      # Volontairement sans cache : un cache partage entre les deux
      # compilations reutiliserait des artefacts portant l'ancien chemin et
      # ferait passer la preuve pour de mauvaises raisons.
      - name: Deux compilations, deux repertoires
        shell: bash
        run: ./outils/verifier-reproductible.sh
