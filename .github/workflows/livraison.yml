# Livraison — construit le portefeuille pour macOS, Windows et Linux.
#
# Se declenche sur une etiquette de version (`v0.2.0`, par exemple) ou a la
# demande. Chaque plateforme compile sur sa propre machine : rien n'est
# compile de facon croisee, donc rien n'est suppose.
#
# # Ce que ces fichiers ne sont pas
#
# Ils ne sont **ni signes ni notaries**. macOS affichera « impossible d'ouvrir,
# le developpeur ne peut pas etre verifie », et Windows affichera un
# avertissement SmartScreen. C'est le comportement normal pour un logiciel sans
# certificat d'editeur, et le contourner demande un compte Apple Developer
# payant et un certificat Authenticode. Tant que ce n'est pas fait, la marche a
# suivre est documentee dans le fichier joint a chaque livraison.
#
# Un logiciel qui garde des clefs privees ne devrait pas etre installe sans
# verification. Trois choses le permettent :
#
# - le condensat SHA-256 de chaque fichier, publie avec lui ;
# - une **attestation de provenance** signee par GitHub, qui lie chaque archive
#   au commit et a l'execution qui l'ont produite. Elle se verifie avec
#   `gh attestation verify <archive> --repo <proprietaire>/<depot>`. GitHub
#   ne l'offre qu'aux depots publics : sur un depot prive, l'etape est sautee ;
# - si le depot detient une clef `MINISIGN_KEY`, une signature `minisign` du
#   fichier `SHA256SUMS`, verifiable hors ligne avec la clef publique publiee
#   dans le README. Sans cette clef, l'etape est simplement sautee.
#
# La chaine d'outils est celle de `rust-toolchain.toml` : deux compilations
# du meme commit produisent le meme binaire.

name: Livraison

# Trois facons de la declencher :
#
# - `workflow_dispatch` : un bouton « Run workflow » dans l'onglet Actions.
#   C'est le plus simple, et c'est celui a employer la premiere fois.
# - une etiquette de version poussee (`v0.1.0`) ;
# - une version publiee depuis le site.
#
# Les deux dernieres publient en plus une page de version telechargeable ; la
# premiere depose seulement les fichiers sur la page de l'execution.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  construire:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: macOS (Apple Silicon)
            os: macos-latest
            cible: aarch64-apple-darwin
            binaire: q21
            archive: q21-macos-arm64.tar.gz
          - nom: macOS (Intel)
            os: macos-latest
            cible: x86_64-apple-darwin
            binaire: q21
            archive: q21-macos-x86_64.tar.gz
          - nom: Windows
            os: windows-latest
            cible: x86_64-pc-windows-msvc
            binaire: q21.exe
            archive: q21-windows-x86_64.zip
          - nom: Linux
            os: ubuntu-latest
            cible: x86_64-unknown-linux-gnu
            binaire: q21
            archive: q21-linux-x86_64.tar.gz
          # Linux ARM 64 bits : Raspberry Pi 5, machines Ampere, serveurs CAX
          # de Hetzner. Construit sur une machine ARM et non compile de facon
          # croisee, comme les quatre autres — les epreuves passent donc sur
          # l'architecture qu'elles verifient. Ces machines sont disponibles
          # depuis aout 2025 pour les depots publics, janvier 2026 pour les
          # autres.
          - nom: Linux (ARM 64)
            os: ubuntu-24.04-arm
            cible: aarch64-unknown-linux-gnu
            binaire: q21
            archive: q21-linux-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Chaine Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.cible }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # On ne livre pas un binaire dont les epreuves n'ont pas ete passees sur
      # cette plateforme. Un portefeuille qui perd des fonds sous Windows
      # seulement est un portefeuille qui perd des fonds.
      - name: Epreuves
        run: |
          cargo test --locked --features mldsa,audit --lib
          cargo test --locked --features mldsa,audit --test regression_securite
          cargo test --locked --features mldsa,audit --test regression_reseau
          cargo test --locked --features mldsa,audit --test regression_phase8b
          cargo test --locked --features mldsa,audit --test audit_persistance
          cargo test --locked --features mldsa,audit --test audit_rpc
          cargo test --locked --features mldsa,audit --test integration
          cargo test --locked --features mldsa,audit --test audit_arith
          cargo test --locked --features mldsa,audit --test audit_mempool
          cargo test --locked --features mldsa,audit --test audit_muhash
          cargo test --locked --features mldsa,audit --test audit_synchro_rapide
          cargo test --locked --features mldsa,audit --test fuzz_decodeurs
          cargo test --locked --features mldsa,audit --test audit_difficulte

      - name: Compilation
        run: cargo build --locked --release --features mldsa --target ${{ matrix.cible }}

      - name: Assemblage
        shell: bash
        run: |
          set -eu
          mkdir -p livraison
          cp "target/${{ matrix.cible }}/release/${{ matrix.binaire }}" livraison/
          cp README.md AUDIT.md PORTEFEUILLE.md livraison/ 2>/dev/null || true
          # Le lanceur a double-cliquer, propre a chaque systeme. Sans lui,
          # l'utilisateur doit ouvrir une fenetre de commande et taper `wallet`,
          # ce qu'aucune application de bureau ne demande.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "Portefeuille Q21.bat" livraison/
          else
            cp "Portefeuille Q21.command" livraison/
            chmod +x "livraison/Portefeuille Q21.command"
          fi
          cd livraison
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.archive }}" ./*
          else
            tar czf "../${{ matrix.archive }}" ./*
          fi

      - name: Condensat SHA-256
        shell: bash
        run: |
          set -eu
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi
          cat "${{ matrix.archive }}.sha256"

      # L'attestation lie l'archive a ce commit et a cette execution, signee
      # par GitHub. Quiconque la verifie sait que le fichier a ete construit
      # ici, a partir de ces sources, et non deposee a la main.
      #
      # GitHub ne l'offre pas aux depots prives d'un compte personnel : elle
      # ne s'execute donc que si le depot est public, et n'empeche jamais la
      # livraison — le condensat et la signature restent la dans tous les cas.
      - name: Attestation de provenance
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.archive }}

      - name: Depot du resultat
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  publier:
    name: Publication
    needs: construire
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' 
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: livraisons
          merge-multiple: true

      # Un seul fichier de condensats pour toutes les archives : c'est lui
      # que l'on signe, et lui que l'on compare.
      - name: SHA256SUMS
        shell: bash
        run: |
          set -eu
          cd livraisons
          rm -f SHA256SUMS
          sha256sum q21-*.tar.gz q21-*.zip > SHA256SUMS
          cat SHA256SUMS

      # Signature hors ligne, si le depot detient la clef. `minisign` tient en
      # un fichier et n'exige aucune infrastructure ; la clef publique est
      # publiee dans le README et son empreinte par un second canal.
      - name: Signature minisign
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "aucune clef MINISIGN_KEY : signature sautee"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_KEY" > minisign.key
          chmod 600 minisign.key
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | minisign -S -s minisign.key \
            -m livraisons/SHA256SUMS -t "Q21 ${GITHUB_REF_NAME}"
          rm -f minisign.key
          cat livraisons/SHA256SUMS.minisig

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          files: livraisons/*
          body: |
            ## Portefeuille Q21

            | Votre machine | L'archive a prendre |
            |---|---|
            | Windows | `q21-windows-x86_64.zip` |
            | Mac Apple Silicon (M1 et suivants) | `q21-macos-arm64.tar.gz` |
            | Mac Intel | `q21-macos-x86_64.tar.gz` |
            | Linux PC ordinaire | `q21-linux-x86_64.tar.gz` |
            | Raspberry Pi 5, Linux ARM | `q21-linux-arm64.tar.gz` |

            Telechargez l'archive de votre systeme, decompressez-la, puis
            **double-cliquez sur le lanceur** :

            - Windows : `Portefeuille Q21.bat`
            - macOS : `Portefeuille Q21.command`
            - Linux : `./q21 wallet` dans un terminal

            Le navigateur s'ouvre et vous guide : creer un portefeuille, ou
            restaurer le votre a partir de son code de sauvegarde. Il n'y a
            aucune commande a taper, et aucune question posee dans la fenetre
            noire.

            **Recopiez le code de sauvegarde sur papier.** C'est le seul moyen
            de retrouver vos fonds si ce disque disparait — et il suffit : sur
            une machine neuve, ce code seul redonne l'integralite du
            portefeuille, adresses comprises.

            ### Une fois dedans

            | Onglet | Ce qu'on y fait |
            |---|---|
            | Solde | ce qui est disponible, ce qui attend sa maturite |
            | Miner | allumer le minage, voir le debit reel de la machine |
            | Recevoir | creer des adresses, les copier |
            | Reseau | la puissance de calcul du reseau, mesuree |
            | Envoyer | payer quelqu'un, avec ecran de confirmation |
            | Activite | l'historique des mouvements |

            La pastille en haut a droite dit **Connecte**, **Synchronisation**
            ou **Hors connexion**. Tant qu'elle n'est pas verte, le solde
            affiche est incomplet — et la page le dit.

            ### Ces fichiers ne sont pas signes

            macOS dira « impossible d'ouvrir, le developpeur ne peut pas etre
            verifie ». Clic droit sur le fichier, puis « Ouvrir », puis
            « Ouvrir » a nouveau dans la fenetre qui s'affiche.

            Windows affichera un avertissement SmartScreen. « Informations
            complementaires », puis « Executer quand meme ».

            Signer ces fichiers pour macOS et Windows demande un compte Apple
            Developer payant et un certificat Authenticode. Tant que ce n'est
            pas fait, trois verifications restent possibles, de la plus simple
            a la plus forte :

            1. le condensat SHA-256 joint (`.sha256`, et `SHA256SUMS` pour
               toutes les archives) : vous avez bien recu ce qui a ete
               construit ici ;
            2. l'attestation de provenance : `gh attestation verify
               <archive> --repo <proprietaire>/<depot>` prouve que l'archive
               sort de cette execution, a partir de ce commit ;
            3. la signature `SHA256SUMS.minisig`, quand elle est jointe :
               `minisign -Vm SHA256SUMS -P <clef publique du README>`.

            ### Avertissement

            Code de recherche. La preuve de travail n'a recu aucune cryptanalyse
            externe, et l'audit a ete mene par ses propres auteurs. Ne confiez a
            ce logiciel aucune valeur reelle.
