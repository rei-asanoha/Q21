# Livraison — construit le portefeuille pour macOS, Windows et Linux.
#
# Se declenche sur une etiquette de version (`v0.2.0`, par exemple) ou a la
# demande. Chaque plateforme compile sur sa propre machine : rien n'est
# compile de facon croisee, donc rien n'est suppose.
#
# # Ce que ces fichiers ne sont pas
#
# Ils ne sont **ni signes ni notaries**. macOS affichera « impossible d'ouvrir,
# le developpeur ne peut pas etre verifie », et Windows affichera un
# avertissement SmartScreen. C'est le comportement normal pour un logiciel sans
# certificat d'editeur, et le contourner demande un compte Apple Developer
# payant et un certificat Authenticode. Tant que ce n'est pas fait, la marche a
# suivre est documentee dans le fichier joint a chaque livraison.
#
# Un logiciel qui garde des clefs privees ne devrait pas etre installe sans
# verification. Trois choses le permettent :
#
# - le condensat SHA-256 de chaque fichier, publie avec lui ;
# - une **attestation de provenance** signee par GitHub, qui lie chaque archive
#   au commit et a l'execution qui l'ont produite. Elle se verifie avec
#   `gh attestation verify <archive> --repo <proprietaire>/<depot>`. GitHub
#   ne l'offre qu'aux depots publics : sur un depot prive, l'etape est sautee ;
# - une signature `minisign` du fichier `SHA256SUMS`, faite avec la clef
#   `MINISIGN_KEY` de l'environnement `livraison`, verifiable hors ligne avec
#   la clef publique publiee dans le README. Sans cette clef, la livraison
#   echoue : une livraison non signee n'est pas une livraison.
#
# La chaine d'outils est celle de `rust-toolchain.toml` : deux compilations
# du meme commit produisent le meme binaire.

name: Livraison

# Trois facons de la declencher :
#
# - `workflow_dispatch` : un bouton « Run workflow » dans l'onglet Actions.
#   C'est le plus simple, et c'est celui a employer la premiere fois.
# - une etiquette de version poussee (`v0.1.0`) ;
# - une version publiee depuis le site.
#
# Les deux dernieres publient en plus une page de version telechargeable ; la
# premiere depose seulement les fichiers sur la page de l'execution.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  construire:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: macOS (Apple Silicon)
            os: macos-latest
            cible: aarch64-apple-darwin
            binaire: q21
            archive: q21-macos-arm64.tar.gz
          - nom: macOS (Intel)
            os: macos-latest
            cible: x86_64-apple-darwin
            binaire: q21
            archive: q21-macos-x86_64.tar.gz
          - nom: Windows
            os: windows-latest
            cible: x86_64-pc-windows-msvc
            binaire: q21.exe
            archive: q21-windows-x86_64.zip
          - nom: Linux
            os: ubuntu-latest
            cible: x86_64-unknown-linux-gnu
            binaire: q21
            archive: q21-linux-x86_64.tar.gz
          # Linux ARM 64 bits : Raspberry Pi 5, machines Ampere, serveurs CAX
          # de Hetzner. Construit sur une machine ARM et non compile de facon
          # croisee, comme les quatre autres — les epreuves passent donc sur
          # l'architecture qu'elles verifient. Ces machines sont disponibles
          # depuis aout 2025 pour les depots publics, janvier 2026 pour les
          # autres.
          - nom: Linux (ARM 64)
            os: ubuntu-24.04-arm
            cible: aarch64-unknown-linux-gnu
            binaire: q21
            archive: q21-linux-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      # Une etiquette qui ne correspond pas a la version du programme publie un
      # binaire qui se presente sous un autre nom que sa livraison : `q21
      # version` repondrait 0.1.0 dans une archive nommee v0.1.1, et le
      # commentaire de confiance de la signature dirait encore autre chose.
      # C'est exactement la confusion que la commande `version` sert a
      # dissiper. Le controle est place avant tout le reste : echouer en dix
      # secondes vaut mieux qu'echouer apres quinze minutes de compilation.
      - name: L'etiquette et la version du programme concordent
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -eu
          ETIQUETTE="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$ETIQUETTE" != "$VERSION" ]; then
            echo "::error::etiquette v$ETIQUETTE, mais Cargo.toml annonce $VERSION : le binaire livre ne dirait pas la version sous laquelle il est publie. Mettez les deux d'accord dans le meme commit, puis re-etiquetez."
            exit 1
          fi
          echo "etiquette v$ETIQUETTE = version $VERSION"

      # `rustup` directement, sans action tierce sur une branche mouvante :
      # voir essais.yml.
      - name: Chaine Rust
        shell: bash
        run: |
          set -eu
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
          rustup target add ${{ matrix.cible }} --toolchain 1.95.0
          rustc --version

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # On ne livre pas un binaire dont les epreuves n'ont pas ete passees sur
      # cette plateforme. Un portefeuille qui perd des fonds sous Windows
      # seulement est un portefeuille qui perd des fonds.
      # Sans argument `--test` : toutes les epreuves du depot, y compris
      # celles ajoutees apres l'ecriture de ce fichier. L'enumeration qui
      # figurait ici avait laisse cinq fichiers d'epreuves hors CI.
      - name: Epreuves
        run: cargo test --locked --features mldsa,audit

      # Compilation reproductible. Le remappage de chemin retire du binaire le
      # repertoire ou il a ete construit — ici `/home/runner/work/<depot>/<depot>`,
      # qui porte le nom du proprietaire du depot et ne doit pas finir dans un
      # fichier publie. Surtout, il rend le binaire identique quel que soit le
      # repertoire : une tierce personne qui recompile ce commit chez elle
      # obtient le meme condensat SHA-256 et n'a a croire personne.
      #
      # `trim-paths` ferait cela dans `Cargo.toml`, mais il n'est pas stabilise
      # dans Cargo 1.95.0 (voir le commentaire du profil `release`).
      #
      # La meme commande a la main : `./outils/construire-reproductible.sh`.
      # Voir REPRODUIRE.md.
      #
      # Windows demande un detour : rustc y recoit des chemins a
      # contre-oblique (`D:\a\depot\depot`), tandis que `pwd` sous git bash
      # rend `/d/a/depot/depot`. On passe les deux formes — le drapeau accepte
      # d'etre repete, et une forme qui ne correspond a rien ne coute rien.
      - name: Compilation reproductible
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            RACINE=$(pwd -W)                                  # D:/a/depot/depot
            RACINE_ANTI=$(printf '%s' "$RACINE" | tr '/' '\\')  # D:\a\depot\depot
            DRAPEAUX="--remap-path-prefix=$RACINE_ANTI=/q21 --remap-path-prefix=$RACINE=/q21"
          else
            RACINE=$(pwd -P)
            DRAPEAUX="--remap-path-prefix=$RACINE=/q21"
          fi
          echo "remappage : $DRAPEAUX"
          RUSTFLAGS="$DRAPEAUX" \
            cargo build --locked --release --features mldsa --target ${{ matrix.cible }}

      # Un binaire livre ne doit plus contenir le chemin de la machine qui l'a
      # construit. Si le remappage a echoue en silence — un `RUSTFLAGS` pose
      # ailleurs, un chemin non canonique, une forme de separateur imprevue —
      # on le voit ici et la livraison s'arrete, au lieu de publier un fichier
      # que personne ne pourra reproduire.
      #
      # `grep -a` traite le binaire comme du texte ; c'est present sur les
      # trois systemes, contrairement a `strings` sous Windows.
      - name: Aucun chemin de construction dans le binaire
        shell: bash
        run: |
          set -eu
          BIN="target/${{ matrix.cible }}/release/${{ matrix.binaire }}"
          ECHEC=0
          for FORME in "$(pwd -P)" "$(pwd)"; do
            [ -n "$FORME" ] || continue
            if grep -a -c -F -- "$FORME" "$BIN" >/dev/null 2>&1; then
              echo "::error::le chemin « $FORME » est inscrit dans $BIN ; le remappage n'a pas pris"
              ECHEC=1
            fi
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            FORME=$(pwd -W | tr '/' '\\')
            if grep -a -c -F -- "$FORME" "$BIN" >/dev/null 2>&1; then
              echo "::error::le chemin « $FORME » est inscrit dans $BIN ; le remappage n'a pas pris"
              ECHEC=1
            fi
          fi
          [ "$ECHEC" -eq 0 ] || exit 1
          echo "aucun chemin de construction dans $BIN"

      - name: Assemblage
        shell: bash
        run: |
          set -eu
          mkdir -p livraison
          cp "target/${{ matrix.cible }}/release/${{ matrix.binaire }}" livraison/
          # REPRODUIRE.md voyage avec le binaire : les instructions pour
          # verifier un fichier ne servent a rien si elles restent sur une
          # page web que celui qui telecharge ne visitera pas.
          cp README.md REJOINDRE.md AUDIT.md PORTEFEUILLE.md REPRODUIRE.md SUCCESSION.md livraison/ 2>/dev/null || true
          # Le lanceur a double-cliquer, propre a chaque systeme. Sans lui,
          # l'utilisateur doit ouvrir une fenetre de commande et taper `wallet`,
          # ce qu'aucune application de bureau ne demande.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "Portefeuille Q21.bat" livraison/
          else
            cp "Portefeuille Q21.command" livraison/
            chmod +x "livraison/Portefeuille Q21.command"
          fi
          # Le point d'entree, livre deja ecrit.
          #
          # Le binaire reste sans adresse — c'est la regle, et elle ne bouge
          # pas : une adresse gravee dans un programme distribue deviendrait
          # une dependance permanente envers celui qui la tient. Mais le
          # fichier qui la porte, lui, voyage rempli. Sans cela, toute archive
          # fraichement decompressee est aveugle, et le nouveau venu lit
          # « aucun ordinateur joignable » sans savoir que rien n'est casse :
          # il conclut que le reseau est mort et n'y revient pas. Le fichier
          # est en clair, commente, et lui appartient des qu'il l'a.
          mkdir -p livraison/q21-data
          cp amorces-par-defaut.txt livraison/q21-data/amorces.txt
          cd livraison
          # `-r` explicite sur 7z : le comportement de `./*` face a un
          # sous-dossier depend de la version et du shell qui developpe le
          # motif. `q21-data/` est precisement un sous-dossier, et une archive
          # Windows qui l'aurait perdu repartait aveugle — sans que rien ne le
          # signale, puisque les archives tar, elles, le portaient.
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -r "../${{ matrix.archive }}" ./*
          else
            tar czf "../${{ matrix.archive }}" ./*
          fi

      # --- L'archive contient-elle vraiment ce qu'on croit y avoir mis ?
      #
      # Assembler et empaqueter sont deux gestes, et le second peut perdre ce
      # que le premier a pose : un outil d'archivage differe d'une plateforme a
      # l'autre, et un sous-dossier absent ne fait echouer personne. C'est
      # arrive : le fichier d'amorces etait bien copie dans `livraison/`, et
      # l'archive Windows partait sans lui. Le defaut ne s'est vu que chez un
      # utilisateur, plusieurs versions plus tard.
      #
      # On ouvre donc l'archive **produite** et on verifie sa liste. Ce qui
      # manque arrete la livraison, au lieu d'etre decouvert par celui qui
      # telecharge.
      - name: L'archive porte bien tout ce qu'il faut
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            LISTE=$(7z l -ba -slt "${{ matrix.archive }}" | sed -n 's/^Path = //p')
          else
            LISTE=$(tar tzf "${{ matrix.archive }}")
          fi
          echo "--- contenu de ${{ matrix.archive }} ---"
          printf '%s\n' "$LISTE"
          echo "---"
          MANQUE=0
          for ATTENDU in "${{ matrix.binaire }}" "q21-data" "amorces.txt" "REJOINDRE.md" "README.md"; do
            if ! printf '%s\n' "$LISTE" | grep -q -- "$ATTENDU"; then
              echo "::error::$ATTENDU est absent de ${{ matrix.archive }}"
              MANQUE=1
            fi
          done
          [ "$MANQUE" -eq 0 ] || exit 1
          echo "archive complete."

      # Deux condensats, et ils ne servent pas a la meme chose.
      #
      # Celui de l'**archive** sert au transport : vous avez bien recu ce qui a
      # ete depose ici. Il n'est PAS reproductible, et ne peut pas l'etre en
      # l'etat : une archive tar ou zip inscrit pour chaque fichier une date de
      # modification, un proprietaire et des permissions, qui dependent de la
      # machine et de l'instant. Deux executions donnent deux archives
      # differentes meme quand le binaire dedans est identique.
      #
      # Celui du **binaire** sert a la verification par recompilation : c'est
      # lui, et lui seul, qu'un tiers retrouve en compilant les memes sources
      # (REPRODUIRE.md). Sans cette ligne, il n'y avait rien a comparer — le
      # seul condensat publie etait celui de l'archive, donc incomparable par
      # construction, et toute la reproductibilite restait inverifiable de
      # l'exterieur.
      - name: Condensats SHA-256 — l'archive et le binaire
        shell: bash
        run: |
          set -eu
          somme() {
            if command -v sha256sum >/dev/null; then sha256sum "$1" | cut -d' ' -f1
            else shasum -a 256 "$1" | cut -d' ' -f1; fi
          }
          ARCHIVE="${{ matrix.archive }}"
          # `q21-linux-x86_64.tar.gz` -> `q21-linux-x86_64` : le nom sous lequel
          # le binaire de cette plateforme est atteste.
          NOM="${ARCHIVE%%.*}"
          BIN="target/${{ matrix.cible }}/release/${{ matrix.binaire }}"

          printf '%s  %s\n' "$(somme "$ARCHIVE")" "$ARCHIVE" > "$ARCHIVE.sha256"
          printf '%s  %s\n' "$(somme "$BIN")"     "$NOM"     > "$NOM.bin.sha256"

          echo "--- archive (transport) ---"; cat "$ARCHIVE.sha256"
          echo "--- binaire (a reproduire) ---"; cat "$NOM.bin.sha256"

      # L'attestation lie l'archive a ce commit et a cette execution, signee
      # par GitHub. Quiconque la verifie sait que le fichier a ete construit
      # ici, a partir de ces sources, et non deposee a la main.
      #
      # GitHub ne l'offre pas aux depots prives d'un compte personnel : elle
      # ne s'execute donc que si le depot est public, et n'empeche jamais la
      # livraison — le condensat et la signature restent la dans tous les cas.
      - name: Attestation de provenance
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.archive }}

      - name: Depot du resultat
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            *.bin.sha256

  # La signature a lieu a **chaque** livraison, pas seulement sur une etiquette
  # de version : c'est la livraison lancee a la main que l'on installe sur le
  # serveur et les machines, et c'est elle qui doit etre signee. Sans clef,
  # le travail echoue — une livraison non signee n'est pas une livraison.
  #
  # # D'ou la clef peut signer
  #
  # Un secret de depot est lu par toute execution lancee depuis le depot, sur
  # n'importe quelle branche : qui pousse une branche et clique « Run
  # workflow » fait signer ce qu'il veut, ou remplace ce `run:` par un envoi
  # de la clef ailleurs. Deux verrous ferment cela :
  #
  # - le travail ne s'execute que sur `main` ou sur une etiquette `v*` — une
  #   branche quelconque ne produit pas de signature ;
  # - les deux secrets vivent dans l'**environnement** GitHub `livraison`,
  #   dont la politique de deploiement n'admet que `main` et `v*`, et dont un
  #   relecteur doit approuver chaque execution. Voir SIGNATURE.md, section 2.
  #   Tant que l'environnement n'existe pas, GitHub le cree sans protection et
  #   les secrets du depot servent encore : rien ne casse, mais rien ne
  #   protege — d'ou la marche a suivre du SIGNATURE.md.
  signer:
    name: Signature
    needs: construire
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: livraison
    steps:
      # Le depot d'abord, les artefacts ensuite : `checkout` nettoie le
      # repertoire de travail, et l'inverse effacerait les archives a signer.
      # On ne vient chercher qu'une chose ici : la clef publique publiee, pour
      # la contre-verification qui suit la signature.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: livraisons
          merge-multiple: true

      # Un seul fichier signe, deux natures de lignes, separees et etiquetees.
      #
      # Les archives repondent a « ai-je bien recu ce qui a ete depose ». Les
      # binaires repondent a « ce fichier sort-il bien de ces sources » — ce
      # sont eux qu'un tiers reproduit, et eux seuls qu'il peut comparer. Les
      # melanger sans le dire conduirait quelqu'un a comparer le condensat de
      # son binaire recompile a celui d'une archive, a ne pas trouver, et a
      # conclure a une falsification.
      - name: SHA256SUMS
        shell: bash
        run: |
          set -eu
          cd livraisons
          rm -f SHA256SUMS
          {
            echo "# Archives — integrite du telechargement. Non reproductibles :"
            echo "# une archive inscrit dates, proprietaires et permissions."
            sha256sum q21-*.tar.gz q21-*.zip
            echo "#"
            echo "# Binaires — a comparer apres recompilation (REPRODUIRE.md)."
            echo "# Meme commit + meme plateforme + meme chaine d'outils = meme condensat."
            cat ./*.bin.sha256
          } > SHA256SUMS
          cat SHA256SUMS

      # Signature hors ligne. `minisign` tient en un fichier et n'exige aucune
      # infrastructure ; la clef publique est publiee dans le README et son
      # empreinte par un second canal. Le condensat seul ne prouve que
      # l'integrite du transport : produit sur la meme machine que les
      # archives, il ne dit rien de qui les a construites. La signature, si.
      - name: Signature minisign
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "::error::aucun secret MINISIGN_KEY : une livraison non signee n'est pas une livraison. Voir SIGNATURE.md."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_KEY" > minisign.key
          chmod 600 minisign.key
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | minisign -S -s minisign.key \
            -m livraisons/SHA256SUMS -t "Q21 ${GITHUB_REF_NAME} ${GITHUB_SHA} -- Rei Asanoha"
          rm -f minisign.key
          cat livraisons/SHA256SUMS.minisig

      # Contre-verification : la signature qu'on vient de produire doit se
      # verifier avec la clef publique **publiee dans le depot**, celle que les
      # gens recopient depuis le README.
      #
      # Sans ce controle, deux pannes silencieuses passent : une clef tournee
      # dans les secrets sans que le depot suive, et un secret subtilement faux.
      # Dans les deux cas la livraison part signee — d'une clef que personne ne
      # peut verifier — et on ne l'apprend que par la plainte d'un utilisateur.
      # Mieux vaut une livraison rouge qu'une livraison qu'on croit signee.
      - name: Contre-verification de la signature
        shell: bash
        run: |
          set -eu
          if [ ! -f q21-livraison.pub ]; then
            echo "::error::q21-livraison.pub absent du depot : la signature ne peut pas etre contre-verifiee. Voir SIGNATURE.md."
            exit 1
          fi
          if ! minisign -Vm livraisons/SHA256SUMS -p q21-livraison.pub; then
            echo "::error::la signature ne se verifie PAS avec la clef publique du depot. La clef des secrets et celle du README ont diverge : livraison interrompue. Voir SIGNATURE.md."
            exit 1
          fi
          echo "Signature verifiee avec la clef publique du depot."

      - name: Depot des condensats signes
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-signe
          path: |
            livraisons/SHA256SUMS
            livraisons/SHA256SUMS.minisig

  publier:
    name: Publication
    needs: signer
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: livraisons
          merge-multiple: true

      # Les condensats signes viennent du travail « Signature ».
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          files: livraisons/*
          body: |
            ## Portefeuille Q21

            | Votre machine | L'archive a prendre |
            |---|---|
            | Windows | `q21-windows-x86_64.zip` |
            | Mac Apple Silicon (M1 et suivants) | `q21-macos-arm64.tar.gz` |
            | Mac Intel | `q21-macos-x86_64.tar.gz` |
            | Linux PC ordinaire | `q21-linux-x86_64.tar.gz` |
            | Raspberry Pi 5, Linux ARM | `q21-linux-arm64.tar.gz` |

            Telechargez l'archive de votre systeme, decompressez-la, puis
            **double-cliquez sur le lanceur** :

            - Windows : `Portefeuille Q21.bat`
            - macOS : `Portefeuille Q21.command`
            - Linux : `./q21 wallet` dans un terminal

            **Avant le premier lancement**, dites au programme ou frapper :
            creez un dossier `q21-data` a cote de lui, et dedans un fichier
            `amorces.txt` contenant la ligne `amorce.q21.dev`. Le programme
            ne contient l'adresse d'aucun serveur, par choix. `REJOINDRE.md`,
            joint a l'archive, detaille ce geste et tout le reste en dix
            minutes, y compris comment devenir soi-meme un point d'entree.

            Le navigateur s'ouvre et vous guide : creer un portefeuille, ou
            restaurer le votre a partir de son code de sauvegarde. Il n'y a
            aucune commande a taper, et aucune question posee dans la fenetre
            noire.

            **Recopiez le code de sauvegarde sur papier.** C'est le seul moyen
            de retrouver vos fonds si ce disque disparait — et il suffit : sur
            une machine neuve, ce code seul redonne l'integralite du
            portefeuille, adresses comprises.

            ### Une fois dedans

            | Onglet | Ce qu'on y fait |
            |---|---|
            | Solde | ce qui est disponible, ce qui attend sa maturite |
            | Miner | allumer le minage, voir le debit reel de la machine |
            | Recevoir | creer des adresses, les copier |
            | Reseau | la puissance de calcul du reseau, mesuree |
            | Envoyer | payer quelqu'un, avec ecran de confirmation |
            | Activite | l'historique des mouvements |

            La pastille en haut a droite dit **Connecte**, **Synchronisation**
            ou **Hors connexion**. Tant qu'elle n'est pas verte, le solde
            affiche est incomplet — et la page le dit.

            ### Ces fichiers ne sont pas signes

            macOS bloque le lanceur — « d'un developpeur non identifie » — ou
            propose de le mettre a la corbeille. Ne le faites pas : Reglages
            Systeme, Confidentialite et securite, tout en bas, « Ouvrir quand
            meme ». Une seule fois : le lanceur leve ensuite lui-meme la
            quarantaine sur le reste du dossier. Avant macOS 15, un clic droit
            sur le lanceur puis « Ouvrir » suffit.

            Windows affichera un avertissement SmartScreen. « Informations
            complementaires », puis « Executer quand meme ».

            Signer ces fichiers pour macOS demande une identite verifiee par
            Apple, et pour Windows un certificat Authenticode — ce projet a
            choisi de n'avoir ni l'une ni l'autre. Trois verifications restent
            possibles, de la plus simple
            a la plus forte :

            1. le condensat SHA-256 joint (`.sha256`, et `SHA256SUMS` pour
               toutes les archives) : vous avez bien recu ce qui a ete
               construit ici ;
            2. l'attestation de provenance : `gh attestation verify
               <archive> --repo <proprietaire>/<depot>` prouve que l'archive
               sort de cette execution, a partir de ce commit ;
            3. la signature `SHA256SUMS.minisig`, jointe a chaque livraison :
               `minisign -Vm SHA256SUMS -P <clef publique du README>`. C'est
               la seule des trois qui prouve **qui** a construit l'archive.

            ### Avertissement

            Code de recherche. La preuve de travail n'a recu aucune cryptanalyse
            externe, et l'audit a ete mene par ses propres auteurs. Ne confiez a
            ce logiciel aucune valeur reelle.
