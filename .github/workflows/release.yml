# Release: builds the wallet for macOS, Windows and Linux.
#
# Triggered by a version tag (`v0.2.0`, for example) or on demand. Each
# platform builds on its own machine: nothing is cross-compiled, so nothing
# is assumed.
#
# # What these files are not
#
# They are **neither signed nor notarized**. macOS will display "cannot be
# opened, the developer cannot be verified", and Windows will display a
# SmartScreen warning. This is the normal behavior for software without a
# publisher certificate, and getting around it requires a paid Apple
# Developer account and an Authenticode certificate. Until that is done, the
# steps to follow are documented in the file attached to each release.
#
# Software that holds private keys should not be installed without
# verification. Three things make it possible:
#
# - the SHA-256 hash of each file, published with it;
# - a **provenance attestation** signed by GitHub, which ties each archive
#   to the commit and the run that produced it. It is verified with
#   `gh attestation verify <archive> --repo <owner>/<repo>`. GitHub only
#   offers it to public repositories: on a private repository, the step is
#   skipped;
# - a `minisign` signature of the `SHA256SUMS` file, made **offline** by the
#   maintainer, on their own machine, never here: the release is created as a
#   draft, the signature is added to it by hand, and the "Verify" job checks
#   it against the public key the moment the release is published. A release
#   whose signature does not verify goes back to draft. See SIGNING.md.
#
# Nothing is built before the whole CI (ci.yml) has passed on the very commit
# being released, without cache, and a tag is refused unless its commit is on
# `main`. Every third-party action is pinned to a commit hash, with its
# version in a comment (tools/pin-actions.sh).
#
# The toolchain is the one in `rust-toolchain.toml`: two builds of the same
# commit produce the same binary.

name: Release

# Three ways to trigger it:
#
# - `workflow_dispatch`: a "Run workflow" button in the Actions tab. It only
#   drops unsigned files on the run's page: for testing, never for
#   installing.
# - a pushed version tag (`v0.1.0`): builds, then creates a **draft** release
#   with the archives and `SHA256SUMS`, waiting for its offline signature;
# - publishing that draft from the website, once signed: only the "Verify"
#   job runs, and nothing is built again.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Least privilege by default; the jobs that need more say so.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tor shipped in the archives (see the "Tor" step). The version is the Tor
  # Expert Bundle of a stable Tor Browser release; the fingerprint is the one
  # the Tor Project publishes for the "Tor Browser Developers" signing key.
  # The download is refused unless its signature verifies with that key.
  TOR_BUNDLE_VERSION: "15.0.25"
  # The tor inside it, for its license text when the binary cannot tell (an
  # Intel binary on an ARM runner): see the "Tor" step.
  TOR_VERSION: "0.4.9.14"
  TOR_SIGNING_KEY: "EF6E286DDA85EA2A4BA7DE684E2C6E8793298290"

jobs:
  # --- Before anything is built: is this a commit we mean to release?
  gate:
    name: Release gate
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A tag that does not match the program version publishes a binary
      # that presents itself under a different name than its release: `q21
      # version` would answer 0.1.0 in an archive named v0.1.1, and the
      # signature's trusted comment would say something else again. That is
      # exactly the confusion the `version` command exists to clear up. The
      # check comes before everything else: failing in ten seconds is better
      # than failing after fifteen minutes of compiling.
      - name: The tag and the program version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG, but Cargo.toml says $VERSION: the released binary would not report the version it is published under. Make them agree in the same commit, then tag again."
            exit 1
          fi
          echo "tag v$TAG = version $VERSION"

      # A tag can be put on any commit, including one that was never on
      # `main` — a branch pushed a minute earlier, never reviewed. Only a
      # commit that `main` contains is released.
      - name: The tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -eu
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main: nothing is released from outside main."
            exit 1
          fi
          echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on main"

  # --- The whole CI, on this very commit, without cache: tests on the three
  # systems, vendored sources identical to crates.io, dependency policy,
  # reproducible build. A release no longer waits on a separate run that
  # someone has to remember to look at.
  checks:
    name: CI
    needs: gate
    if: github.event_name != 'release'
    uses: ./.github/workflows/ci.yml
    with:
      no-cache: true

  build:
    name: ${{ matrix.name }}
    needs: [gate, checks]
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            binary: q21
            archive: q21-macos-arm64.tar.gz
            tor: macos-aarch64
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            binary: q21
            archive: q21-macos-x86_64.tar.gz
            tor: macos-x86_64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: q21.exe
            archive: q21-windows-x86_64.zip
            tor: windows-x86_64
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: q21
            archive: q21-linux-x86_64.tar.gz
            tor: linux-x86_64
          # 64-bit ARM Linux: Raspberry Pi 5, Ampere machines, Hetzner CAX
          # servers. Built on an ARM machine and not cross-compiled, like the
          # other four, so the tests run on the architecture they check.
          # These machines have been available since August 2025 for public
          # repositories, January 2026 for the others.
          - name: Linux (ARM 64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: q21
            archive: q21-linux-arm64.tar.gz
            # No stable Tor Expert Bundle exists for 64-bit ARM Linux: a
            # Raspberry Pi uses the Tor of its system (`apt install tor`).
            tor: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `rustup` directly, without a third-party action on a moving branch:
      # see ci.yml.
      - name: Rust toolchain
        shell: bash
        run: |
          set -eu
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
          rustup target add ${{ matrix.target }} --toolchain 1.95.0
          rustc --version

      # No cache here: what is published is compiled from the sources alone,
      # not from state left behind by earlier runs.

      # We do not release a binary whose tests have not passed on this
      # platform. A wallet that loses funds on Windows only is a wallet that
      # loses funds.
      # Without a `--test` argument: every test in the repository, including
      # those added after this file was written. The list that used to be
      # here had left five test files out of CI.
      - name: Tests
        run: cargo test --locked --features mldsa,audit

      # Reproducible build. The path remapping removes from the binary the
      # directory it was built in (here `/home/runner/work/<repo>/<repo>`),
      # which carries the name of the repository owner and must not end up
      # in a published file. Above all, it makes the binary identical
      # whatever the directory: a third party who rebuilds this commit at
      # home gets the same SHA-256 hash and has no one to trust.
      #
      # `trim-paths` would do this in `Cargo.toml`, but it is not stabilized
      # in Cargo 1.95.0 (see the comment on the `release` profile).
      #
      # The same command by hand: `./tools/build-reproducible.sh`.
      # See REPRODUCING.md.
      #
      # Windows needs a detour: rustc receives backslash paths there
      # (`D:\a\repo\repo`), while `pwd` under git bash returns
      # `/d/a/repo/repo`. We pass both forms: the flag can be repeated, and a
      # form that matches nothing costs nothing.
      - name: Reproducible build
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            ROOT=$(pwd -W)                                    # D:/a/repo/repo
            ROOT_BACKSLASH=$(printf '%s' "$ROOT" | tr '/' '\\')  # D:\a\repo\repo
            FLAGS="--remap-path-prefix=$ROOT_BACKSLASH=/q21 --remap-path-prefix=$ROOT=/q21"
          else
            ROOT=$(pwd -P)
            FLAGS="--remap-path-prefix=$ROOT=/q21"
          fi
          echo "remapping: $FLAGS"
          RUSTFLAGS="$FLAGS" \
            cargo build --locked --release --features mldsa --target ${{ matrix.target }}

      # A released binary must no longer contain the path of the machine that
      # built it. If the remapping failed silently (a `RUSTFLAGS` set
      # elsewhere, a non-canonical path, an unexpected separator form), we
      # see it here and the release stops, instead of publishing a file that
      # no one will be able to reproduce.
      #
      # `grep -a` treats the binary as text; it is available on all three
      # systems, unlike `strings` on Windows.
      - name: No build path in the binary
        shell: bash
        run: |
          set -eu
          FAILED=0
          # The program, and the launcher without a window that ships with it.
          LAUNCHER="target/${{ matrix.target }}/release/q21-wallet"
          [ "${{ runner.os }}" = "Windows" ] && LAUNCHER="$LAUNCHER.exe"
          for BIN in "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$LAUNCHER"; do
            for PATH_FORM in "$(pwd -P)" "$(pwd)"; do
              [ -n "$PATH_FORM" ] || continue
              if grep -a -c -F -- "$PATH_FORM" "$BIN" >/dev/null 2>&1; then
                echo "::error::the path \"$PATH_FORM\" is written in $BIN; the remapping did not take"
                FAILED=1
              fi
            done
            if [ "${{ runner.os }}" = "Windows" ]; then
              PATH_FORM=$(pwd -W | tr '/' '\\')
              if grep -a -c -F -- "$PATH_FORM" "$BIN" >/dev/null 2>&1; then
                echo "::error::the path \"$PATH_FORM\" is written in $BIN; the remapping did not take"
                FAILED=1
              fi
            fi
          done
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          [ "$FAILED" -eq 0 ] || exit 1
          echo "no build path in $BIN"

      # --- Tor, so that nobody has to install it.
      #
      # The wallet starts it itself when Tor is turned on (see
      # src/tor_process.rs). It comes from the Tor Project, never from a
      # mirror we cannot check: the archive is refused unless its signature
      # verifies with the Tor Browser Developers key, identified by the
      # fingerprint pinned at the top of this file. The key is fetched by WKD
      # (the method the Tor Project documents), keys.openpgp.org otherwise;
      # whatever is fetched, only a signature by that fingerprint is accepted.
      #
      # dist.torproject.org keeps only the current releases; older ones move
      # to archive.torproject.org, tried second.
      - name: Tor, from the Tor Project, signature verified
        if: matrix.tor != ''
        shell: bash
        run: |
          set -eu
          NAME="tor-expert-bundle-${{ matrix.tor }}-${TOR_BUNDLE_VERSION}.tar.gz"
          mkdir -p tor-download && cd tor-download
          fetched=0
          for BASE in "https://dist.torproject.org/torbrowser/${TOR_BUNDLE_VERSION}" \
                      "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_BUNDLE_VERSION}"; do
            if curl -fsSL -o "$NAME" "$BASE/$NAME" && curl -fsSL -o "$NAME.asc" "$BASE/$NAME.asc"; then
              fetched=1; echo "downloaded from $BASE"; break
            fi
          done
          [ "$fetched" -eq 1 ] || { echo "::error::$NAME could not be downloaded"; exit 1; }
          command -v gpg >/dev/null || brew install gnupg
          export GNUPGHOME="$PWD/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          gpg --batch --auto-key-locate nodefault,wkd --locate-keys torbrowser@torproject.org >/dev/null 2>&1 \
            || curl -fsSL "https://keys.openpgp.org/vks/v1/by-fingerprint/${TOR_SIGNING_KEY}" | gpg --batch --import
          STATUS=$(gpg --batch --status-fd 1 --verify "$NAME.asc" "$NAME" 2>/dev/null || true)
          printf '%s\n' "$STATUS" | grep -E '^\[GNUPG:\] (GOODSIG|VALIDSIG|ERRSIG|BADSIG|EXPKEYSIG)' || true
          if ! printf '%s\n' "$STATUS" | grep -q '^\[GNUPG:\] GOODSIG ' \
             || ! printf '%s\n' "$STATUS" | grep -q "^\[GNUPG:\] VALIDSIG .*${TOR_SIGNING_KEY}"; then
            echo "::error::$NAME is not signed by the Tor Browser Developers key ${TOR_SIGNING_KEY}: not shipped"
            exit 1
          fi
          echo "signature verified: ${TOR_SIGNING_KEY}"
          if command -v sha256sum >/dev/null; then sha256sum "$NAME"; else shasum -a 256 "$NAME"; fi
          mkdir -p ../tor-bundle
          tar xzf "$NAME" -C ../tor-bundle
          cd ../tor-bundle
          echo "--- bundle contents ---"; find . -maxdepth 3 | sort
          # The executable is where the bundle puts it, nowhere else.
          EXE=tor/tor
          [ "${{ runner.os }}" = "Windows" ] && EXE=tor/tor.exe
          [ -f "$EXE" ] || { echo "::error::$EXE is not in the bundle"; exit 1; }
          # Tor's license (3-clause BSD) travels with it. The version comes
          # from the binary when it runs here, from TOR_VERSION otherwise.
          V=$(LD_LIBRARY_PATH=tor "$EXE" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          [ -n "$V" ] || V="$TOR_VERSION"
          echo "tor $V"
          curl -fsSL -o TOR-LICENSE.txt "https://gitlab.torproject.org/tpo/core/tor/-/raw/tor-${V}/LICENSE" \
            || { echo "::error::the license of tor $V could not be downloaded"; exit 1; }
          echo "$V" > TOR-VERSION.txt

      - name: Assemble
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          # REPRODUCING.md travels with the binary: the instructions for
          # verifying a file are useless if they stay on a web page that the
          # person downloading it will not visit.
          cp README.md JOIN.md WHITEPAPER.md AUDIT.md WALLET.md REPRODUCING.md SUCCESSION.md TOR.md dist/ 2>/dev/null || true
          # The double-click launcher, specific to each system. Without it,
          # the user has to open a command window and type `wallet`, which no
          # desktop application asks for.
          #
          # On Windows and macOS, it opens no window at all
          # (src/bin/q21-wallet.rs): `Q21 Wallet.exe`, and `Q21 Wallet.app`,
          # a bundle macOS opens without a Terminal. The script launchers stay,
          # renamed so that they are not taken for the application: they
          # show what the wallet prints, for whoever wants to see it.
          LAUNCHER="target/${{ matrix.target }}/release/q21-wallet"
          # The console variants go into Troubleshooting/ (0.4.9): side by
          # side with the application, a user double-clicked the script and
          # saw a Terminal open behind the browser, which looked like a fault.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$LAUNCHER.exe" "dist/Q21 Wallet.exe"
            mkdir -p dist/Troubleshooting
            cp "Q21 Wallet.bat" "dist/Troubleshooting/Q21 Wallet - console.bat"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            APP="dist/Q21 Wallet.app"
            mkdir -p "$APP/Contents/MacOS"
            cp "$LAUNCHER" "$APP/Contents/MacOS/q21-wallet"
            chmod +x "$APP/Contents/MacOS/q21-wallet"
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
            sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
            plutil -lint "$APP/Contents/Info.plist"
            # Ad hoc signature of the whole bundle: no identity, but a
            # consistent one. Unsigned, or with only its executable signed,
            # a downloaded bundle is reported "damaged" by macOS instead of
            # "from an unidentified developer", which the guides explain.
            codesign --force --sign - "$APP"
            codesign --verify --verbose "$APP"
            mkdir -p dist/Troubleshooting
            cp "Q21 Wallet.command" "dist/Troubleshooting/Q21 Wallet - Terminal.command"
            chmod +x "dist/Troubleshooting/Q21 Wallet - Terminal.command"
          else
            cp "Q21 Wallet.command" dist/
            chmod +x "dist/Q21 Wallet.command"
          fi
          # The entry point, shipped already filled in.
          #
          # The binary stays without an address; that is the rule, and it
          # does not change: an address hard-coded into a distributed program
          # would become a permanent dependency on whoever holds it. But the
          # file that carries it travels filled in. Without it, every freshly
          # unpacked archive is blind, and the newcomer reads "no reachable
          # computer" without knowing that nothing is broken: they conclude
          # the network is dead and do not come back. The file is plain text,
          # commented, and belongs to them as soon as they have it.
          # Two copies, on purpose.
          #
          # Flat next to the binary: a plain file goes through tar, 7z and
          # zip unconditionally. This is the one we rely on.
          #
          # In q21-data: this is the file the guides describe, the one the
          # user edits, and it takes precedence over the other. It lives in a
          # subfolder, and that is precisely what a packaging tool can lose.
          # Together, the two make sure that losing one leaves no one blind.
          cp default-bootstrap.txt dist/bootstrap.txt
          mkdir -p dist/q21-data
          cp default-bootstrap.txt dist/q21-data/bootstrap.txt
          # Tor, verified in the previous step: the executable and the files
          # next to it, the GeoIP tables in tor/data/, and where it comes from.
          # The pluggable transports (bridges) are left out: they are for
          # censored networks, and weigh more than Tor itself.
          if [ -d tor-bundle ]; then
            TOR_EXE=tor-bundle/tor/tor
            [ "${{ runner.os }}" = "Windows" ] && TOR_EXE=tor-bundle/tor/tor.exe
            mkdir -p dist/tor/data
            find tor-bundle/tor -maxdepth 1 -type f -exec cp {} dist/tor/ \;
            chmod +x "dist/tor/$(basename "$TOR_EXE")"
            for G in geoip geoip6; do
              F=$(find tor-bundle -type f -name "$G" | head -n 1)
              [ -n "$F" ] && cp "$F" dist/tor/data/
            done
            cp tor-bundle/TOR-LICENSE.txt dist/tor/LICENSE.txt
            # The bundle's own documents (licenses of what Tor is built
            # with), whole, when it has them.
            [ -d tor-bundle/docs ] && cp -R tor-bundle/docs dist/tor/docs
            cp tools/TOR-IN-THIS-ARCHIVE.txt dist/tor/README.txt
            echo "Tor Expert Bundle ${TOR_BUNDLE_VERSION} (${{ matrix.tor }}), tor $(cat tor-bundle/TOR-VERSION.txt), signature verified with ${TOR_SIGNING_KEY}" >> dist/tor/README.txt
            echo "--- dist/tor ---"; ls -la dist/tor dist/tor/data
          fi
          cd dist
          # Explicit `-r` on 7z: how `./*` behaves with a subfolder depends on
          # the version and on the shell that expands the pattern. `q21-data/`
          # is precisely a subfolder, and a Windows archive that had lost it
          # started out blind again, with nothing to signal it, since the tar
          # archives did carry it.
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -r "../${{ matrix.archive }}" ./*
          else
            # No AppleDouble `._` files for extended attributes (macOS tar):
            # they would clutter the archive and the application bundle.
            COPYFILE_DISABLE=1 tar czf "../${{ matrix.archive }}" ./*
          fi

      # --- Does the archive really contain what we think we put in it?
      #
      # Assembling and packing are two steps, and the second can lose what
      # the first put in place: an archiving tool differs from one platform
      # to another, and a missing subfolder makes nothing fail. It happened:
      # the bootstrap file was indeed copied into `dist/`, and the Windows
      # archive shipped without it. The defect only showed up on a user's
      # machine, several versions later.
      #
      # So we open the archive that was **produced** and check its listing.
      # Anything missing stops the release, instead of being discovered by
      # the person who downloads it.
      - name: The archive carries everything it should
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            LISTING=$(7z l -ba -slt "${{ matrix.archive }}" | sed -n 's/^Path = //p')
          else
            LISTING=$(tar tzf "${{ matrix.archive }}")
          fi
          echo "--- contents of ${{ matrix.archive }} ---"
          printf '%s\n' "$LISTING"
          echo "---"
          MISSING=0
          for EXPECTED in "${{ matrix.binary }}" "q21-data" "bootstrap.txt" "JOIN.md" "README.md"; do
            if ! printf '%s\n' "$LISTING" | grep -q -- "$EXPECTED"; then
              echo "::error::$EXPECTED is missing from ${{ matrix.archive }}"
              MISSING=1
            fi
          done
          # The launcher without a window, on the systems that have one.
          if [ "${{ runner.os }}" = "Windows" ]; then
            printf '%s\n' "$LISTING" | tr -d '\r' | grep -qF "Q21 Wallet.exe" \
              || { echo "::error::Q21 Wallet.exe is missing from ${{ matrix.archive }}"; MISSING=1; }
            printf '%s\n' "$LISTING" | tr -d '\r' | grep -qE 'Troubleshooting[/\\]Q21 Wallet - console\.bat$' \
              || { echo "::error::Troubleshooting/Q21 Wallet - console.bat is missing from ${{ matrix.archive }}"; MISSING=1; }
          elif [ "${{ runner.os }}" = "macOS" ]; then
            for EXPECTED in "Q21 Wallet.app/Contents/MacOS/q21-wallet" "Q21 Wallet.app/Contents/Info.plist" "Troubleshooting/Q21 Wallet - Terminal.command"; do
              printf '%s\n' "$LISTING" | grep -qF "$EXPECTED" \
                || { echo "::error::$EXPECTED is missing from ${{ matrix.archive }}"; MISSING=1; }
            done
          fi
          # Tor, on the platforms that ship it: the switch in the wallet does
          # nothing visible without it.
          if [ -n "${{ matrix.tor }}" ]; then
            # 7z lists Windows paths with backslashes: both separators.
            for EXPECTED in 'tor[/\\]README\.txt' 'tor[/\\]LICENSE\.txt' 'tor[/\\]data[/\\]geoip$'; do
              if ! printf '%s\n' "$LISTING" | tr -d '\r' | grep -qE -- "$EXPECTED"; then
                echo "::error::$EXPECTED is missing from ${{ matrix.archive }}"
                MISSING=1
              fi
            done
            if ! printf '%s\n' "$LISTING" | tr -d '\r' | grep -qE 'tor[/\\]tor(\.exe)?$'; then
              echo "::error::the tor executable is missing from ${{ matrix.archive }}"
              MISSING=1
            fi
          fi
          [ "$MISSING" -eq 0 ] || exit 1
          echo "archive complete."

      # Two hashes, and they do not serve the same purpose.
      #
      # The one for the **archive** is for transport: you did receive what
      # was uploaded here. It is NOT reproducible, and cannot be as things
      # stand: a tar or zip archive records, for each file, a modification
      # date, an owner and permissions, which depend on the machine and the
      # moment. Two runs give two different archives even when the binary
      # inside is identical.
      #
      # The one for the **binary** is for verification by rebuilding: it is
      # this one, and only this one, that a third party gets again by
      # compiling the same sources (REPRODUCING.md). Without this line, there
      # was nothing to compare: the only published hash was the archive's,
      # incomparable by construction, and all of the reproducibility remained
      # unverifiable from the outside.
      - name: SHA-256 hashes — the archive and the binary
        shell: bash
        run: |
          set -eu
          checksum() {
            if command -v sha256sum >/dev/null; then sha256sum "$1" | cut -d' ' -f1
            else shasum -a 256 "$1" | cut -d' ' -f1; fi
          }
          ARCHIVE="${{ matrix.archive }}"
          # `q21-linux-x86_64.tar.gz` -> `q21-linux-x86_64`: the name under
          # which this platform's binary is attested.
          NAME="${ARCHIVE%%.*}"
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"

          printf '%s  %s\n' "$(checksum "$ARCHIVE")" "$ARCHIVE" > "$ARCHIVE.sha256"
          printf '%s  %s\n' "$(checksum "$BIN")"     "$NAME"    > "$NAME.bin.sha256"

          echo "--- archive (transport) ---"; cat "$ARCHIVE.sha256"
          echo "--- binary (to reproduce) ---"; cat "$NAME.bin.sha256"

      # The attestation ties the archive to this commit and this run, signed
      # by GitHub. Anyone who verifies it knows that the file was built here,
      # from these sources, and not uploaded by hand.
      #
      # GitHub does not offer it to private repositories of a personal
      # account: it therefore only runs if the repository is public, and
      # never blocks the release; the hash and the signature are there in
      # every case.
      - name: Build provenance attestation
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload the result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            *.bin.sha256

  # --- The hashes of every archive and every binary, in one file.
  #
  # Unsigned here, on purpose: the signing key never comes to GitHub. The file
  # is attached to the draft release and signed offline (SIGNING.md).
  sums:
    name: SHA256SUMS
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      # A single file, two kinds of lines, separated and labeled.
      #
      # The archives answer "did I receive what was uploaded". The binaries
      # answer "does this file really come from these sources": they are what
      # a third party reproduces, and the only thing they can compare. Mixing
      # them without saying so would lead someone to compare the hash of
      # their rebuilt binary with that of an archive, find no match, and
      # conclude there was tampering.
      - name: SHA256SUMS
        shell: bash
        run: |
          set -eu
          cd artifacts
          rm -f SHA256SUMS
          {
            echo "# Archives — download integrity. Not reproducible:"
            echo "# an archive records dates, owners and permissions."
            sha256sum q21-*.tar.gz q21-*.zip
            echo "#"
            echo "# Binaries — to compare after rebuilding (REPRODUCING.md)."
            echo "# Same commit + same platform + same toolchain = same hash."
            cat ./*.bin.sha256
          } > SHA256SUMS
          cat SHA256SUMS

      # The exact command to sign with, ready to copy. The trusted comment
      # names the tag and the commit: the "Verify" job requires exactly this.
      - name: How to sign this release
        shell: bash
        run: |
          set -eu
          echo "On the machine that holds q21-release.key, next to the downloaded SHA256SUMS:"
          echo
          echo "  minisign -S -s q21-release.key -m SHA256SUMS -t \"Q21 ${GITHUB_REF_NAME} ${GITHUB_SHA} -- Rei Asanoha\""
          echo
          echo "Then attach SHA256SUMS.minisig to the draft release, and publish it once"
          echo "attestations/threshold independent attestations are on main (attestations/README.md)."

      - name: Upload the hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS

  # --- A version tag: the release page, as a draft. Nobody sees it, nobody
  # can download it, until it is signed and published by hand.
  publish:
    name: Draft release
    needs: sums
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: true
          # The archives, and the hashes that prove them. The per-file
          # .sha256 of the build jobs are inside SHA256SUMS already. The
          # signature, SHA256SUMS.minisig, is added offline.
          files: |
            artifacts/q21-*.tar.gz
            artifacts/q21-*.zip
            artifacts/SHA256SUMS
          body: |
            ## Q21 wallet — public testnet

            | Your computer | Archive to download |
            |---|---|
            | Windows | `q21-windows-x86_64.zip` |
            | Mac with Apple Silicon (M1 and later) | `q21-macos-arm64.tar.gz` |
            | Mac with Intel | `q21-macos-x86_64.tar.gz` |
            | Regular Linux PC | `q21-linux-x86_64.tar.gz` |
            | Raspberry Pi 5, Linux ARM | `q21-linux-arm64.tar.gz` |

            Download the archive for your system, unzip it, then
            **double-click the launcher**:

            - Windows: `Q21 Wallet.exe`
            - macOS: `Q21 Wallet.app`
            - Linux: `./q21 wallet` in a terminal

            No window opens: the wallet is the page in your browser. Launched
            again, it opens its page again; it stops with the "Close the
            wallet" button, Info tab.

            The archive already contains `bootstrap.txt`, a plain-text file
            naming the testnet entry point: there is nothing to type. The
            program itself contains no server address, by design; the file is
            yours to edit. `JOIN.md`, included in the archive, covers every
            step in ten minutes, including how to become an entry point
            yourself.

            Your browser opens and guides you: create a wallet, or restore
            yours from its backup code. The interface is available in English,
            French and Japanese.

            **Write the backup code down on paper.** It is the only way to
            recover your funds if this disk is lost — and it is enough: on a
            new machine, that code alone restores the whole wallet, addresses
            included.

            ### Tor, included

            The Windows, macOS and Linux x86_64 archives carry Tor, in the
            `tor/` folder: the Tor Expert Bundle published by the Tor Project,
            unchanged, its signature verified against the Tor Browser
            Developers key before it is packed (`tor/README.txt`). In the
            wallet, **Network** tab, one switch: every connection then goes
            through Tor, and nothing else needs installing. On a Raspberry Pi,
            install Tor with `sudo apt install tor`. See `TOR.md`.

            ### Once inside

            | Tab | What it does |
            |---|---|
            | Balance | what is available, what is still maturing |
            | Mine | turn mining on, see the machine's real hash rate |
            | Receive | create addresses, copy them |
            | Network | the network's computing power, measured |
            | Send | pay someone, with a confirmation screen |
            | Activity | transaction history |

            The badge in the top-right corner reads **Connected**,
            **Syncing** or **Offline**. Until it is green, the displayed
            balance may be incomplete — and the page says so.

            ### These files are not code-signed

            macOS blocks `Q21 Wallet.app` ("unidentified developer") or offers
            to move it to the Trash. Don't: open System Settings, Privacy &
            Security, scroll to the bottom, "Open Anyway". Once is enough: the
            application then removes the quarantine from the rest of the
            folder itself. Before macOS 15, right-click the launcher and choose
            "Open".

            Windows shows a SmartScreen warning: "More info", then
            "Run anyway".

            Code-signing for macOS requires an identity verified by Apple, and
            for Windows an Authenticode certificate — this project chose to
            have neither. Three checks remain, from simplest to strongest:

            1. the attached SHA-256 hash (`.sha256`, and `SHA256SUMS` for all
               archives): you received what was built here;
            2. the build provenance attestation: `gh attestation verify
               <archive> --repo <owner>/<repo>` proves the archive came from
               this run, from this commit;
            3. the `SHA256SUMS.minisig` signature attached to every release:
               `minisign -Vm SHA256SUMS -P <public key from the README>`. It
               is made offline, on the maintainer's own machine; the signing
               key never comes to GitHub. It is the only one of the three
               that proves **who** released the archive. See `SIGNING.md`.

            ### Warning

            Research code. The proof of work has had no external
            cryptanalysis, and the audit was carried out by its own authors.
            Do not trust this software with anything of real value.

  # --- A release published by hand: is it signed, for the right commit,
  # confirmed by enough independent rebuilds, and does every archive match?
  #
  # This job signs nothing and builds nothing. It catches the mistakes of an
  # offline signature — a forgotten .minisig, the wrong file signed, the
  # wrong key, a comment naming another commit — before anyone installs. A
  # release that fails goes back to draft at once. What it cannot catch is a
  # takeover of this repository, key file included: that is what the public
  # key published elsewhere than here is for (SIGNING.md).
  verify:
    name: Verify the signature
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Two questions, kept apart.
      #
      # 1. Who released it: `SHA256SUMS.minisig`, made offline with the key
      #    of `q21-release.pub`, its trusted comment naming this tag and this
      #    commit. One person's statement, no more.
      # 2. Does it come from the sources: the attestations filed on `main`
      #    under `attestations/<tag>/` by people who rebuilt the binaries
      #    themselves, each signed by its own key in `builder-keys/` (see
      #    attestations/README.md — the mechanism of bitcoin-core/guix.sigs).
      #    Every binary hash an attestation states must be the release's.
      #    `attestations/threshold` says how many are required before a
      #    release may stand: 0 as long as nobody else rebuilds, more as
      #    independent builders join. No single key, the maintainer's
      #    included, can then publish alone.
      - name: Signature, attestations and archives
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          COMMIT=$(git rev-parse "refs/tags/${TAG}^{commit}")
          mkdir rel
          gh release download "$TAG" --dir rel
          ls -la rel
          [ -f rel/SHA256SUMS ] || { echo "::error::SHA256SUMS is missing from the release"; exit 1; }

          # 1. The release signature.
          [ -f rel/SHA256SUMS.minisig ] || { echo "::error::SHA256SUMS.minisig is missing: the release is not signed"; exit 1; }
          [ -f q21-release.pub ] || { echo "::error::q21-release.pub is missing from the repository"; exit 1; }
          OUT=$(minisign -Vm rel/SHA256SUMS -x rel/SHA256SUMS.minisig -p q21-release.pub) || {
            echo "::error::the signature does NOT verify with the repository public key"; exit 1; }
          printf '%s\n' "$OUT"
          EXPECTED="Q21 ${TAG} ${COMMIT} -- Rei Asanoha"
          COMMENT=$(printf '%s\n' "$OUT" | sed -n 's/^Trusted comment: //p')
          if [ "$COMMENT" != "$EXPECTED" ]; then
            echo "::error::trusted comment \"$COMMENT\", expected \"$EXPECTED\""
            exit 1
          fi

          # 2. The attestations, as `main` holds them now: they are filed
          #    after the tag, by pull request.
          git fetch --no-tags origin main
          rm -rf att && mkdir att
          git archive origin/main attestations | tar -x -C att
          THRESHOLD=0
          if [ -f att/attestations/threshold ]; then
            THRESHOLD=$(tr -dc '0-9' < att/attestations/threshold)
            THRESHOLD=${THRESHOLD:-0}
          fi
          AGREE=0
          for D in att/attestations/"$TAG"/*/; do
            [ -d "$D" ] || continue
            WHO=$(basename "$D")
            KEY="att/attestations/builder-keys/$WHO.pub"
            if [ ! -f "$KEY" ] || [ ! -f "$D/SHA256SUMS" ] || [ ! -f "$D/SHA256SUMS.minisig" ]; then
              echo "::warning::attestation of $WHO incomplete (key, SHA256SUMS or signature missing): not counted"
              continue
            fi
            AOUT=$(minisign -Vm "$D/SHA256SUMS" -p "$KEY" 2>/dev/null) || {
              echo "::warning::attestation of $WHO: signature invalid, not counted"; continue; }
            ACOMMENT=$(printf '%s\n' "$AOUT" | sed -n 's/^Trusted comment: //p')
            case "$ACOMMENT" in
              *"$TAG"*"$COMMIT"*) ;;
              *) echo "::warning::attestation of $WHO names another version or commit (\"$ACOMMENT\"): not counted"; continue ;;
            esac
            LINES=0
            MISMATCH=0
            while read -r H NAME; do
              [ -n "$H" ] || continue
              case "$H" in \#*) continue ;; esac
              LINES=$((LINES + 1))
              if [ "$(awk -v n="$NAME" '$2 == n {print $1}' rel/SHA256SUMS)" != "$H" ]; then
                echo "::error::$WHO rebuilt $NAME as $H, which is NOT the released binary"
                MISMATCH=1
              fi
            done < "$D/SHA256SUMS"
            [ "$MISMATCH" -eq 0 ] || exit 1
            [ "$LINES" -ge 1 ] || { echo "::warning::attestation of $WHO states no hash: not counted"; continue; }
            echo "agrees: $WHO ($LINES binaries)"
            AGREE=$((AGREE + 1))
          done
          echo "$AGREE independent attestation(s) agree; $THRESHOLD required"
          if [ "$AGREE" -lt "$THRESHOLD" ]; then
            echo "::error::$AGREE attestation(s) for $TAG, $THRESHOLD required: wait for the builders (attestations/README.md)"
            exit 1
          fi

          # 3. Every archive of the release is listed, and matches.
          cd rel
          N=0
          for A in q21-*.tar.gz q21-*.zip; do
            [ -f "$A" ] || continue
            LINE=$(awk -v a="$A" '$2 == a' SHA256SUMS)
            [ -n "$LINE" ] || { echo "::error::$A is not in SHA256SUMS"; exit 1; }
            printf '%s\n' "$LINE" | sha256sum -c -
            N=$((N + 1))
          done
          [ "$N" -ge 5 ] || { echo "::error::$N archives in the release, 5 expected"; exit 1; }
          echo "signature, $AGREE attestation(s) and $N archives verified for $TAG ($COMMIT)"

      - name: Back to draft
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" --draft=true --repo "$GITHUB_REPOSITORY"
          echo "::error::$TAG is back to draft: nobody can download it. Fix the signature (SIGNING.md), then publish again."
