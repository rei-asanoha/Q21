[package]
name = "q21-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Noyau de consensus du protocole Q21 — types, emission, hachage, adresses post-quantiques"
license = "MIT OR Apache-2.0"

[lib]
name = "q21_core"
path = "src/lib.rs"

# Aucune dependance obligatoire.
#
# Le code de consensus ne doit dependre que de ce qu'on peut auditer. Tout ce qui
# est ici — SHA-256, Bech32m, Merkle, emission — est implemente et teste contre
# des vecteurs officiels.
#
# ML-DSA fait exception et N'EST PAS implemente ici : ecrire soi-meme un schema
# de signature a reseaux euclidiens est une faute professionnelle. Le module `sig`
# definit l'interface ; l'implementation reelle se branche via la feature `mldsa`
# une fois les crates disponibles :
#
#   cargo add ml-dsa            # RustCrypto
#   cargo build --features mldsa
# Pour brancher la cryptographie reelle, sur une machine ayant acces a
# crates.io, decommenter le bloc ci-dessous puis :
#
#   cargo build  --features mldsa
#   cargo test   --features mldsa
#
# [dependencies]
# Versions confirmees par resolution reelle (cargo tree, 2026-08) :
#   ml-dsa 0.1.1 -> signature 3.0.0, rand_core 0.10.1, crypto-common 0.2.2,
#                   hybrid-array 0.4.14, digest 0.11.3, shake 0.1.0,
#                   module-lattice 0.2.3, pkcs8 0.11.0
# rand_core 0.10 n'a PAS de feature `os_rng` (contrairement a 0.9).
#
# Le noyau n'a toujours aucune dependance obligatoire. `ml-dsa` n'est tire que
# si la feature `mldsa` est demandee.
#
# `default-features = false` : on refuse `getrandom` et `pkcs8`. Un noeud ne fait
# que **verifier** des signatures. Il n'a besoin ni d'aleatoire ni d'un format
# d'export de clefs, et chaque dependance en moins est une surface d'attaque en
# moins. La signature vit dans le portefeuille, pas dans le consensus.
[dependencies]
ml-dsa = { version = "0.1.1", optional = true, default-features = false, features = ["alloc"] }

# Une seule fonction en est tiree : `setrlimit`, pour interdire les vidages
# memoire d'un processus qui garde une graine. `libc` est deja dans le graphe
# de dependances (par `getrandom`), vendorise comme le reste ; le declarer ici
# n'ajoute rien a compiler. Le declarer a la main avec `extern "C"` obligerait
# a reproduire la disposition de `rlimit`, qui differe d'un systeme a l'autre.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
mldsa = ["dep:ml-dsa"]
# Expose quelques crochets internes aux epreuves d'audit hors du crate. Jamais
# active dans une compilation de production : ce sont des fabricants d'etat
# incoherent, utiles pour prouver qu'une barriere tient, dangereux ailleurs.
audit = []

[profile.release]
overflow-checks = true   # jamais de wraparound silencieux dans du code monetaire
panic = "abort"

# La preuve de travail memory-hard fait 33 condensats par tentative. Non
# optimise, un test qui mine deux cents blocs prend des minutes pour de mauvaises
# raisons. On garde les controles de debordement : c'est du code monetaire.
[profile.test]
opt-level = 2
overflow-checks = true

[profile.dev]
opt-level = 1
overflow-checks = true
