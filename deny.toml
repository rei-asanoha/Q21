# Politique des dependances, appliquee par `cargo deny check` en integration
# continue.
#
# Le projet n'a qu'une dependance directe (`ml-dsa`) et ses sources sont
# vendorisees. Ce fichier verrouille ce que cela signifie : aucune faille
# publiee sans qu'on le sache, aucune licence inattendue, aucune source hors
# de crates.io, aucune dependance en double.

[graph]
all-features = true

[advisories]
# Une faille publiee (base RustSec) sur une dependance fait echouer la
# verification. Les avis « non maintenu » et « non fiable » sont signales.
#
# `unmaintained` et `unsound` ne prennent plus un niveau (« deny », « warn »)
# mais une **portee** : quelles caisses examiner. `all` = toutes, y compris
# les dependances transitives ; `workspace` = les notres seulement ; `none` =
# aucune. Un avis trouve dans la portee est toujours une erreur. L'ancienne
# forme `unsound = "deny"` a cesse d'etre lue par cargo-deny en septembre
# 2026, et la chaine d'integration s'est arretee sur ce fichier sans qu'une
# ligne de code ait change : c'est le prix d'une action tierce suivie par une
# etiquette mouvante (`@v2`), voir SIGNATURE.md, section 5.
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
# Deux versions d'un meme paquet, c'est deux fois la surface a auditer.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
